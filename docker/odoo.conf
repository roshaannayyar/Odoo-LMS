[options]
addons_path = /opt/odoo/addons,/opt/odoo/custom-addons
data_dir = /var/lib/odoo/data

; Overridden at runtime by ODOO_ADMIN_PASSWD — do not rely on this default.
admin_passwd = admin

; DB connection (db_host/db_user/db_password/db_name) is intentionally left
; unset here. Odoo reads it from the standard libpq PGHOST/PGPORT/PGUSER/
; PGPASSWORD/PGDATABASE env vars, which Railway's Postgres plugin provides.

proxy_mode = True
without_demo = True
log_level = info
logfile =
